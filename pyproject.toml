[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctf-agent"
version = "0.1.0"
description = "基于 LLM Agent 的 GZCTF 自动解题系统"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "openai>=1.30",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
]

[project.scripts]
ctf-agent = "ctf_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctf_agent"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
